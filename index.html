<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Sinal</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Barra de servidores — decorativa por enquanto, o app só tem uma sala.
       Fica pronta pra virar navegação de verdade se um dia existir mais de
       uma sala. -->
  <div class="rail">
    <div class="rail-item brand" title="Sinal">
      <svg viewBox="0 0 24 24" fill="none"><path d="M4 15c2-6 6-9 8-9s6 3 8 9" stroke="#1a1305" stroke-width="2.4" stroke-linecap="round"/><circle cx="12" cy="17" r="1.6" fill="#1a1305"/></svg>
    </div>
    <div class="rail-sep"></div>
    <div class="rail-item active" title="Sala local">SL</div>
    <div class="rail-add" title="Mais salas em breve">+</div>
  </div>

  <!-- Coluna lateral — decorativa, mas a lista "NA CHAMADA" é real e
       espelha exatamente quem está na chamada no momento (renderer.js
       mantém isso sincronizado). -->
  <div class="sidebar">
    <div class="server-title">Sinal <span class="sub">· sala local</span></div>

    <div class="nav-label">NA CHAMADA</div>
    <div class="voice-members" id="voice-members">
      <!-- preenchido dinamicamente pelo renderer.js -->
    </div>

    <div class="sidebar-bottom">
      <div class="avatar big" id="self-avatar">VC</div>
      <div>
        <div class="vm-name" style="color:var(--text-0);font-size:13px;">Você</div>
        <div class="me-status mono" id="status">iniciando…</div>
      </div>
    </div>
  </div>

  <div class="stage">
    <div class="topbar">
      <div class="topbar-title">Sala local <span class="sub" id="participant-count"></span></div>
      <div class="sharing-pill" id="sharing-pill" hidden><span class="sharing-dot"></span><span id="sharing-text"></span></div>
    </div>

    <div class="main-area">
      <!-- Os tiles de vídeo (um por participante) são criados e removidos
           dinamicamente pelo renderer.js conforme as pessoas entram/saem da
           chamada — não tem mais um "local" e "remote" fixos. -->
      <div class="video-grid" id="video-grid"></div>

      <div class="pre-join" id="pre-join">
        <button id="call-btn" class="join-btn">Entrar na chamada</button>
      </div>

      <div class="controls-row" id="controls-row" hidden>
        <button id="mic-btn" class="ctrl-btn" title="Mudo">
          <svg viewBox="0 0 24 24" fill="none"><path d="M12 15a3 3 0 003-3V6a3 3 0 10-6 0v6a3 3 0 003 3z" stroke="currentColor" stroke-width="1.8"/><path d="M6 11a6 6 0 0012 0M12 19v2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
        <button id="camera-btn" class="ctrl-btn" title="Câmera">
          <svg viewBox="0 0 24 24" fill="none"><rect x="4" y="6" width="14" height="11" rx="2" stroke="currentColor" stroke-width="1.8"/><path d="M18 10l4-2.4v9.8l-4-2.4" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
        </button>
        <button id="share-btn" class="ctrl-btn" title="Compartilhar tela">
          <svg viewBox="0 0 24 24" fill="none"><rect x="3" y="5" width="18" height="12" rx="2" stroke="currentColor" stroke-width="1.8"/><path d="M9 21h6M12 17v4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
      </div>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
